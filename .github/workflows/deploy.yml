name: deploy

# Pipeline applicativa: build dell'immagine e deploy su Cloud Run. Separata dalla pipeline
# Terraform (terraform.yml), che gestisce solo l'infrastruttura.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configura Docker per Artifact Registry
        run: gcloud auth configure-docker "${{ vars.REGION }}-docker.pkg.dev" --quiet

      - name: Calcola il tag immagine
        id: image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stessa regola di devops/cloud/locals.tf: "sage-backend", oppure
          # "<prefisso>-sage-backend" in un progetto condiviso. Vale sia per il repository
          # Artifact Registry sia per Cloud Run.
          PREFIX="${{ vars.RESOURCE_PREFIX }}"
          APP="${PREFIX:+${PREFIX}-}sage-backend"
          IMAGE="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${APP}/${APP}:${SHORT_SHA}"
          # Stessa regola di devops/cloud/locals.tf per il bucket delle istruzioni:
          # "<prefisso>-instructions", oppure "<project_id>-instructions" senza prefisso.
          INSTRUCTIONS_BUCKET="${PREFIX:-${{ vars.PROJECT_ID }}}-instructions"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "instructions_bucket=$INSTRUCTIONS_BUCKET" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: sources/backend
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Deploy su Cloud Run
        run: |
          # --update-env-vars (non --set-env-vars): aggiorna solo le due variabili delle
          # istruzioni e lascia intatte quelle impostate da Terraform (progetto, regione,
          # prefisso). Il bucket esiste già: lo crea devops/cloud/instructions.tf.
          gcloud run deploy "${{ steps.image.outputs.app }}" \
            --project "${{ vars.PROJECT_ID }}" \
            --region "${{ vars.REGION }}" \
            --image "${{ steps.image.outputs.tag }}" \
            --update-env-vars "SAGE_INSTRUCTIONS_BUCKET_NAME=${{ steps.image.outputs.instructions_bucket }},SAGE_INSTRUCTIONS_BLOB_NAME=istruzioni.md"

